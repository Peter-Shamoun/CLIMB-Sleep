# Bounded-repeat sleep, RANDOM arm. Same regime as sh_rand_off.yaml (TQ's
# loss/random/0.1 CLM cell) except that each sleep phase lasts
# ceil(3.5 * buffer / 32) steps; see sh_rr_strict.yaml for the rationale.

wake_block_steps: 9999999
sleep_wake_ratio: 9.0 # unused for the budget when replay_repeats > 0
replay_repeats: 3.5
replay_ratio: 0.1
replay_strategy: "random"
replay_criteria: "loss"
replay_decay_rate: 0.05334773969181028
n_augmentations: 40
n_phases: 50
max_seq_length: 128
contextualize_sleep: True

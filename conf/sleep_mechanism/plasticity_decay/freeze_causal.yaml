# Neuron-freezing plasticity decay, CAUSAL neuron selection.
# Neurons are ranked by Captum LayerIntegratedGradients attribution of the LM
# loss to each MLP output feature; the most causally active are frozen each
# cycle. Requires captum (see requirements.txt).
enabled: True
decay_type: "freeze"
mode: "causal"
freeze_target: "mlp"
freeze_type: "complete"
decay: 0.1
plasticity_ceiling: 0.5
plasticity_decay_factor: 0.1
freezing_ratio: 0.25
seed: 0

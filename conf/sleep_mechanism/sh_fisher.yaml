# Synaptic homeostasis experiments: importance_signal = "fisher".
# Protects weights with largest E[grad^2] accumulated over the wake phase. Needs per-sample grads on EVERY wake step (~6x slower); run as the control at the best Taylor setting.
# Override the two SH knobs from the CLI, e.g.
#   sleep_mechanism=sh_fisher sleep_mechanism.plasticity_decay.shrink_factor=0.9 \
#   sleep_mechanism.plasticity_decay.protect_top_fraction=0.5
# Control arm without SH: sleep_mechanism=sh_off.

wake_block_steps: 9999999
sleep_wake_ratio: 20.0 # num eq. epochs - 1
replay_ratio: 0.1
replay_strategy: "weighted"
replay_criteria: "loss"
replay_decay_rate: 0.1
n_augmentations: 40
n_phases: 50
max_seq_length: 128
contextualize_sleep: True

plasticity_decay:
  enabled: true
  decay_type: "fisher_protected_shrink"
  importance_signal: "fisher"
  shrink_factor: 0.95
  protect_top_fraction: 0.20
  threshold_scope: "per_tensor"

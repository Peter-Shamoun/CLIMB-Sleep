# Synaptic homeostasis experiments: empirical Fisher diagonal.
# Replay regime identical to sh_off (see that file); only plasticity_decay
# differs. Importance = E[(dL/dw)^2] accumulated over the wake phase;
# protects the top 20% per tensor, shrinks the rest by 0.95 at SLEEP->WAKE.

wake_block_steps: 9999999
sleep_wake_ratio: 9.0 # num eq. epochs - 1
replay_ratio: 0.1
replay_strategy: "strict"
replay_criteria: "loss"
replay_decay_rate: 0.05334773969181028
n_augmentations: 40
n_phases: 50
max_seq_length: 128
contextualize_sleep: True

plasticity_decay:
  enabled: true
  decay_type: "fisher_protected_shrink"
  importance_signal: "fisher"
  shrink_factor: 0.95
  protect_top_fraction: 0.20
  threshold_scope: "per_tensor"

wake_block_steps: 1000
sleep_max_steps: 200
sleep_loss_threshold: 2.0

# Keep top-k% high-loss samples from wake for replay
replay_ratio: 0.1

# Number of wake/sleep cycles
n_phases: 5

# Contextualization during sleep (rechunking across samples)
contextualize_sleep: true
max_seq_length: 128
n_augmentations: 40

# Lightweight perplexity-only eval around phase transitions
fast_eval: true
fast_eval_num_samples: 1000


# Epoch-training control for the CLM replay cells (Sep 2026).
# Same as baseline-like.yaml (one phase, replay everything, no
# contextualization = plain epoch training) but with sleep_wake_ratio 9 so
# the step budget matches the sleep cells built on default.yaml:
#   total wake = ceil(len(train)/batch) = 34,394 steps on strict 100M / batch 32
#   sleep cells (n_phases 50): 34,394 + 50 * ceil(34,394/50) * 9 = 343,994
#   this config  (n_phases 1): 34,394 + 34,394 * 9              = 343,940
# i.e. 10 equivalent epochs either way (54 steps apart from per-phase rounding).
#   python train.py sleep_mechanism=baseline_like_clm task=base_clm model=gpt2_small dataset=strict

wake_block_steps: 9999999
sleep_wake_ratio: 9.0 # num eq. epochs - 1
replay_ratio: 1.0
replay_strategy: "weighted"
n_augmentations: 1000
n_phases: 1
max_seq_length: 128
contextualize_sleep: False

# Synaptic homeostasis experiments: CONTROL arm (SH off).
# Same replay regime as sh_taylor_signed / sh_taylor_abs / sh_fisher so the
# shrink is the only difference. Cell taken from the 8/25 rerun matrix:
# loss criterion, weighted, ratio 0.1, decay 0.1, n_phases 50, swr 20.

wake_block_steps: 9999999
sleep_wake_ratio: 20.0 # num eq. epochs - 1
replay_ratio: 0.1
replay_strategy: "weighted"
replay_criteria: "loss"
replay_decay_rate: 0.1
n_augmentations: 40
n_phases: 50
max_seq_length: 128
contextualize_sleep: True

defaults:
  - base_config
  - _self_
  - dataset: strict
  - objective_curriculum: base_mlm
  - model: roberta_pln_small
  - tokenizer: cbt_8192
  # Uncomment the following line to enable sleep mechanism:
  - sleep_mechanism: length_by_ratio

dataset:
  name: "cambridge-climb/BabyLM"

model:
  model_kwargs:
    vocab_size: 8192

experiment:
  seed: 42
  entity: "lemn-lab"
  group: "sleep-consolidated-learning"
  name: "sleep-wake-ratio-run"
  output_dir: "/mnt/data"

data_preprocessing:
  include_punctuation: True
  join_sentences: True
  max_input_length: 128

trainer:
  batch_size: 32 # across 4 GPUs gives an effective batch size of 128
  lr: 1e-3 # 1e-4 is used in fairseq; 1e-3 is default in huggingface
  num_warmup_steps: 1_000
  max_training_steps: 80_000
  eval_blimp: False
  eval_fast: True
  eval_glue: False
  eval_msgs: False
  eval_perplexity: True
  n_eval_samples: 100
  eval_batch_size: 4
  mask_probability: 0.15
  unmask_probability: 0

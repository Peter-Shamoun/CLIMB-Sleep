program: train.py
name: scl-sweep-2
project: sleep-consolidated-learning
method: bayes
metric:
  goal: minimize
  name: eval/best_perplexity_mean

parameters:
  trainer.lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 1e-2
  trainer.batch_size:
    values: [16, 32, 64]
  trainer.num_warmup_steps:
    values: [10000, 50000, 100000]
  sleep_mechanism.replay_ratio:
    # range: [0.1, 0.7] # not supported by W&B
    distribution: uniform
    min: 0.1
    max: 0.7
  sleep_mechanism.sleep_max_steps:
    values: [500, 1000, 2000]
  sleep_mechanism.n_phases:
    values: [5, 10, 50, 100]
  sleep_mechanism.n_augmentations:
    values: [20, 40, 60]

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

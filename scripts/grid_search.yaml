program: train.py
name: scl-grid-sweep
project: sleep-consolidated-learning
method: grid
metric:
  goal: minimize
  name: eval/best_perplexity_mean

parameters:
  sleep_mechanism.replay_ratio:
    values: [0.2, 0.4, 0.6, 1.0]
  sleep_mechanism.sleep_max_steps:
    values: [1000, 2000, 4000, 8000]
  sleep_mechanism.n_phases:
    values: [1, 25, 50, 100]
  sleep_mechanism.contextualize_sleep:
    values: [True, False]

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

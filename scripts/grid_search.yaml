program: train.py
name: scl-grid-sweep-fixed
project: sleep-consolidated-learning
method: grid
metric:
  goal: minimize
  name: eval/best_perplexity_mean

parameters:
  sleep_mechanism.replay_ratio:
    values: [0.2, 0.4, 0.6]
  sleep_mechanism.sleep_wake_ratio:
    values: [1.0, 2.0, 5.0]
  sleep_mechanism.n_phases:
    values: [50, 100, 365, 500]
  # sleep_mechanism.contextualize_sleep:
  #   values: [True, False]

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}

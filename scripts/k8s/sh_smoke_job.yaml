# One-pod Nautilus Job for smoke tests under CLM (SH path, resume path).
# Mirrors the replay-batch-* Jobs (image, setup.sh, PVC, node exclusions).
# Fill the __*__ placeholders from your env before applying; never commit
# a rendered copy. __TAG__ names the Job / run (sh-clm-smoke-__TAG__) and
# __SLEEP_CFG__ picks conf/sleep_mechanism/<cfg>.yaml (sh_smoke for SH).
#   kubectl create -f <rendered>.yaml -n dsc-capstone-25-26
#   kubectl get pods -n dsc-capstone-25-26 -l job-name=sh-smoke-clm-__TAG__
#   kubectl logs -f <pod> -n dsc-capstone-25-26
# Resume smoke: wait for checkpoint-<N>/rng_state.pth to appear on the PVC,
# `kubectl delete pod <pod>`; the Job restarts it and the log must show
# "Resume args: experiment.resume_checkpoint_path=..." and "Resuming from".
apiVersion: batch/v1
kind: Job
metadata:
  name: sh-smoke-clm-__TAG__
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: gpu-container
        image: pytorch/pytorch:2.1.0-cuda12.1-cudnn8-runtime
        env:
        - name: HF_READ_TOKEN
          value: "__HF_READ_TOKEN__"
        - name: HF_WRITE_TOKEN
          value: "__HF_WRITE_TOKEN__"
        - name: HUGGINGFACE_HUB_TOKEN
          value: "__HF_READ_TOKEN__"
        - name: HF_HOME
          value: /mnt/data/huggingface
        - name: WANDB_API_KEY
          value: "__WANDB_API_KEY__"
        - name: RUN_NAME
          value: "sh-clm-smoke-__TAG__"
        - name: SLEEP_CFG
          value: "__SLEEP_CFG__"
        - name: AUTO_RESUME
          value: "1"
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Pod started with PyTorch + CUDA"
          apt-get update --fix-missing && apt-get install -y --no-install-recommends git unzip
          git clone https://github.com/Peter-Shamoun/CLIMB-Sleep.git
          cd CLIMB-Sleep
          git checkout main_refactor
          git log --oneline -1
          ./setup.sh /mnt/data/evaluation_data.zip
          . .venv/bin/activate
          export PATH="$(pwd)/.venv/bin:$PATH"
          which python
          RESUME_ARGS=$(python scripts/k8s/resume_args.py /mnt/data/checkpoints/sleep-consolidated-learning/$RUN_NAME)
          echo "Resume args: ${RESUME_ARGS:-none}"
          python train.py sleep_mechanism=$SLEEP_CFG dataset=strict_small task=base_clm model=gpt2_small \
            experiment.dry_run=true trainer.num_warmup_steps=50 \
            experiment.name=$RUN_NAME experiment.group=sh-smoke $RESUME_ARGS
          echo "Finished smoke test"
        volumeMounts:
        - mountPath: /mnt/data
          name: storage-volume
        resources:
          limits:
            nvidia.com/gpu: "1"
            memory: 8G
            cpu: "2"
          requests:
            nvidia.com/gpu: "1"
            memory: 8G
            cpu: "2"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - k8s-gpu-01.calit2.optiputer.net
                - k8s-chase-ci-01.calit2.optiputer.net
                - k8s-chase-ci-02.calit2.optiputer.net
                - k8s-chase-ci-03.calit2.optiputer.net
                - k8s-chase-ci-04.calit2.optiputer.net
                - k8s-chase-ci-05.calit2.optiputer.net
                - k8s-haosu-15.sdsc.optiputer.net
                - k8s-haosu-18.sdsc.optiputer.net
                - k8s-haosu-11.sdsc.optiputer.net
                - k8s-ravi-01.calit2.optiputer.net
                - chi-dgx-node02.csuchico.edu
                - fiona8-1.calit2.uci.edu
                - nautilus-ext-gpu01.fullerton.edu
                - hcc-chase-shor-c4705.unl.edu
                - k8s-chase-ci-07.calit2.optiputer.net
                - hcc-nrp-shor-c6017.unl.edu
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: scl-replay-experiments-2
